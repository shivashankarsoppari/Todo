spring.application.name=todo-app
server.servlet.context-path=/todo
server.port=8080

spring.ai.mcp.server.name=todo-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Manage todo tasks with tools to list, create, update, complete, and delete todos.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=PT15M
app.jwt.token-key-prefix=${REDIS_JWT_KEY_PREFIX:todo-app:jwt:}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
