<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <title>Today | Todo</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1f2937;
            background: #f5f6f8;
            font-synthesis: none;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 64px 20px; }
        main { width: min(100%, 680px); margin: 0 auto; }
        .eyebrow { margin: 0 0 8px; color: #6b7280; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        .environment { display: inline-block; margin: 0 0 18px; padding: 5px 9px; border-radius: 999px; background: #e9eaff; color: #4338ca; font-size: 12px; font-weight: 650; }
        h1 { margin: 0; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.05em; }
        .subtitle { margin: 8px 0 28px; color: #6b7280; }
        .composer, .todo-list { overflow: hidden; border: 1px solid #e5e7eb; border-radius: 16px; background: #fff; box-shadow: 0 12px 36px #1f29370c; }
        .composer { padding: 18px; }
        .auth-panel { padding: 18px; border: 1px solid #e5e7eb; border-radius: 16px; background: #fff; box-shadow: 0 12px 36px #1f29370c; }
        .auth-panel h2 { margin: 0 0 14px; font-size: 18px; }
        .auth-panel input { margin-bottom: 10px; padding: 12px 14px; }
        .auth-actions { display: flex; gap: 8px; }
        .secondary { padding: 11px 16px; background: #e9eaff; color: #4338ca; }
        #app-content[hidden], #auth-panel[hidden] { display: none; }
        .session-toolbar { display: flex; justify-content: flex-end; margin: 0 0 14px; }
        input, textarea { width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; color: inherit; font: inherit; outline: none; }
        input:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px #6366f122; }
        #title { padding: 13px 14px; font-weight: 600; }
        #description { min-height: 76px; margin-top: 10px; padding: 12px 14px; resize: vertical; }
        .form-footer, .toolbar, .todo, .todo-actions { display: flex; align-items: center; }
        .form-footer { justify-content: space-between; gap: 12px; margin-top: 12px; }
        button { border: 0; border-radius: 9px; cursor: pointer; font: inherit; font-weight: 650; }
        .primary { padding: 11px 16px; background: #4f46e5; color: white; }
        .primary:hover { background: #4338ca; }
        .toolbar { justify-content: space-between; gap: 12px; margin: 28px 2px 12px; }
        .filters { display: flex; gap: 5px; }
        .filter { padding: 8px 11px; background: transparent; color: #6b7280; font-size: 13px; }
        .filter.active { background: #e9eaff; color: #4338ca; }
        #count { color: #6b7280; font-size: 13px; }
        .todo { gap: 13px; padding: 17px 18px; border-bottom: 1px solid #f0f1f3; }
        .todo:last-child { border-bottom: 0; }
        .check { flex: 0 0 20px; width: 20px; height: 20px; accent-color: #4f46e5; cursor: pointer; }
        .todo-content { min-width: 0; flex: 1; }
        .todo-title { margin: 0; overflow-wrap: anywhere; font-weight: 650; }
        .todo-description { margin: 5px 0 0; color: #6b7280; font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
        .todo.done .todo-title { color: #9ca3af; text-decoration: line-through; }
        .todo-actions { gap: 5px; }
        .icon-button { padding: 8px; background: transparent; color: #6b7280; font-size: 13px; }
        .icon-button:hover { background: #f3f4f6; color: #111827; }
        .empty { padding: 36px 16px; color: #6b7280; text-align: center; }
        #status { min-height: 20px; color: #b42318; font-size: 13px; }
        @media (max-width: 520px) {
            body { padding: 36px 14px; }
            .todo { align-items: flex-start; padding: 15px; }
            .todo-actions { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">A little more focus</p>
    <p class="environment" id="environment">Environment: loading...</p>
    <h1>Today</h1>
    <p class="subtitle">Make room for what matters.</p>

    <section class="auth-panel" id="auth-panel">
        <h2>Sign in or create an account</h2>
        <form id="auth-form">
            <input id="username" name="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9._-]+"
                   placeholder="Username" autocomplete="username" required>
            <input id="password" name="password" type="password" minlength="12" maxlength="72"
                   placeholder="Password (at least 12 characters)" autocomplete="current-password" required>
            <div class="form-footer">
                <span id="auth-status" role="status" aria-live="polite"></span>
                <div class="auth-actions">
                    <button class="secondary" id="register-button" type="button">Create account</button>
                    <button class="primary" type="submit">Sign in</button>
                </div>
            </div>
        </form>
    </section>

    <section id="app-content" hidden>
    <div class="session-toolbar">
        <button class="icon-button" id="logout-button" type="button">Sign out</button>
    </div>
    <form class="composer" id="todo-form">
        <input id="title" name="title" maxlength="200" placeholder="What needs to get done?" required autocomplete="off">
        <textarea id="description" name="description" maxlength="2000" placeholder="Add a note (optional)"></textarea>
        <div class="form-footer">
            <span id="status" role="status" aria-live="polite"></span>
            <button class="primary" id="submit-button" type="submit">Add task</button>
        </div>
    </form>

    <div class="toolbar">
        <div class="filters" aria-label="Filter tasks">
            <button class="filter active" type="button" data-filter="all">All</button>
            <button class="filter" type="button" data-filter="active">Active</button>
            <button class="filter" type="button" data-filter="completed">Completed</button>
        </div>
        <span id="count"></span>
    </div>
    <section class="todo-list" id="todo-list" aria-label="Todo list"></section>
    </section>
</main>
<script>
    const authForm = document.querySelector("#auth-form");
    const authPanel = document.querySelector("#auth-panel");
    const authStatus = document.querySelector("#auth-status");
    const appContent = document.querySelector("#app-content");
    const usernameInput = document.querySelector("#username");
    const passwordInput = document.querySelector("#password");
    const form = document.querySelector("#todo-form");
    const titleInput = document.querySelector("#title");
    const descriptionInput = document.querySelector("#description");
    const list = document.querySelector("#todo-list");
    const status = document.querySelector("#status");
    const submitButton = document.querySelector("#submit-button");
    const count = document.querySelector("#count");
    const environmentLabel = document.querySelector("#environment");
    const apiBase = "/todo/api/todos";
    const authBase = "/todo/api/auth";
    let token = sessionStorage.getItem("todo-token");
    let todos = [];
    let filter = "all";
    let editingId = null;

    async function request(path, options = {}) {
        const response = await fetch(`${apiBase}${path}`, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(token ? { "Authorization": `Bearer ${token}` } : {}),
                ...options.headers
            }
        });
        if (!response.ok) {
            const problem = await response.json().catch(() => null);
            throw new Error(problem?.detail || problem?.message || `Request failed (${response.status})`);
        }
        return response.status === 204 ? null : response.json();
    }

    function showError(error) {
        status.textContent = error.message;
    }

    function render() {
        const visible = todos.filter(todo =>
            filter === "all" || (filter === "active" ? !todo.completed : todo.completed)
        );
        count.textContent = `${todos.filter(todo => !todo.completed).length} left`;
        list.replaceChildren();

        if (visible.length === 0) {
            const empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = todos.length === 0 ? "Nothing here yet. Add your first task above." : "No tasks in this view.";
            list.append(empty);
            return;
        }

        for (const todo of visible) {
            const row = document.createElement("article");
            row.className = `todo${todo.completed ? " done" : ""}`;

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "check";
            checkbox.checked = todo.completed;
            checkbox.setAttribute("aria-label", `Mark ${todo.title} ${todo.completed ? "active" : "completed"}`);
            checkbox.addEventListener("change", () => updateCompletion(todo.id, checkbox.checked));

            const content = document.createElement("div");
            content.className = "todo-content";
            const heading = document.createElement("p");
            heading.className = "todo-title";
            heading.textContent = todo.title;
            content.append(heading);
            if (todo.description) {
                const description = document.createElement("p");
                description.className = "todo-description";
                description.textContent = todo.description;
                content.append(description);
            }

            const actions = document.createElement("div");
            actions.className = "todo-actions";
            actions.append(
                actionButton("Edit", () => beginEdit(todo)),
                actionButton("Delete", () => deleteTodo(todo.id))
            );
            row.append(checkbox, content, actions);
            list.append(row);
        }
    }

    function actionButton(label, action) {
        const button = document.createElement("button");
        button.className = "icon-button";
        button.type = "button";
        button.textContent = label;
        button.addEventListener("click", action);
        return button;
    }

    async function loadTodos() {
        todos = await request("");
        render();
    }

    async function authenticate(path) {
        authStatus.textContent = "";
        const response = await fetch(`${authBase}/${path}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: usernameInput.value, password: passwordInput.value })
        });
        if (!response.ok) {
            const problem = await response.json().catch(() => null);
            throw new Error(problem?.detail || problem?.message || `Request failed (${response.status})`);
        }
        const result = await response.json();
        token = result.token;
        sessionStorage.setItem("todo-token", token);
        authPanel.hidden = true;
        appContent.hidden = false;
        passwordInput.value = "";
        await loadTodos();
    }

    async function loadEnvironment() {
        const response = await fetch("api/environment");
        if (!response.ok) {
            throw new Error(`Environment request failed (${response.status})`);
        }
        const environment = await response.json();
        environmentLabel.textContent = `Environment: ${environment.name}`;
    }

    function beginEdit(todo) {
        editingId = todo.id;
        titleInput.value = todo.title;
        descriptionInput.value = todo.description || "";
        submitButton.textContent = "Save changes";
        titleInput.focus();
        form.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetForm() {
        editingId = null;
        form.reset();
        submitButton.textContent = "Add task";
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        status.textContent = "";
        const payload = { title: titleInput.value, description: descriptionInput.value };
        try {
            if (editingId === null) {
                await request("", { method: "POST", body: JSON.stringify(payload) });
            } else {
                await request(`/${editingId}`, { method: "PUT", body: JSON.stringify(payload) });
            }
            resetForm();
            await loadTodos();
        } catch (error) {
            showError(error);
        }
    });

    async function updateCompletion(id, completed) {
        status.textContent = "";
        try {
            await request(`/${id}`, { method: "PATCH", body: JSON.stringify({ completed }) });
            await loadTodos();
        } catch (error) {
            showError(error);
        }
    }

    async function deleteTodo(id) {
        status.textContent = "";
        try {
            await request(`/${id}`, { method: "DELETE" });
            if (editingId === id) resetForm();
            await loadTodos();
        } catch (error) {
            showError(error);
        }
    }

    document.querySelectorAll(".filter").forEach(button => {
        button.addEventListener("click", () => {
            filter = button.dataset.filter;
            document.querySelectorAll(".filter").forEach(item => item.classList.toggle("active", item === button));
            render();
        });
    });

    authForm.addEventListener("submit", event => {
        event.preventDefault();
        authenticate("login").catch(error => {
            authStatus.textContent = error.message;
        });
    });

    document.querySelector("#register-button").addEventListener("click", () => {
        authenticate("register").catch(error => {
            authStatus.textContent = error.message;
        });
    });

    document.querySelector("#logout-button").addEventListener("click", () => {
        sessionStorage.removeItem("todo-token");
        token = null;
        todos = [];
        render();
        appContent.hidden = true;
        authPanel.hidden = false;
    });

    if (token) {
        authPanel.hidden = true;
        appContent.hidden = false;
        loadTodos().catch(error => {
            sessionStorage.removeItem("todo-token");
            token = null;
            appContent.hidden = true;
            authPanel.hidden = false;
            authStatus.textContent = error.message;
        });
    }
    loadEnvironment().catch(() => {
        environmentLabel.textContent = "Environment: unavailable";
    });
</script>
</body>
</html>
