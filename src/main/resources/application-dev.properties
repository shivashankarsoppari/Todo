# Oracle XE defaults can be overridden with environment variables.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/xe}
spring.datasource.username=${DB_USERNAME:c##app_user}
spring.datasource.password=app_user
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
